<title>업무매뉴얼 작성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 문서 작업대 — 왼쪽 단계 레일 + 오른쪽 작업면. 좁은 화면에서는 레일이 위쪽 탭 줄이 된다. */
:root {
  --paper: #f6f7f9;
  --sheet: #ffffff;
  --ink: #1d2733;
  --muted: #5c6b7a;
  --line: #d9dfe6;
  --accent: #2c5a85;
  --accent-soft: #dde5f0;
  --check: #b5530f;
  --check-soft: #fbeadb;
  --capture: #6b5a12;
  --capture-soft: #f6efc9;
  --ok: #2f6b3f;
  --ok-soft: #dcefe0;
  --code-bg: #eef1f4;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "D2Coding", Consolas, ui-monospace, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141a21; --sheet: #1b232c; --ink: #e3e9ef; --muted: #9aa8b6; --line: #2e3a46;
    --accent: #8db6dc; --accent-soft: #233447; --check: #f0a46a; --check-soft: #3a2717;
    --capture: #e3cf7a; --capture-soft: #332c12; --ok: #8fd0a0; --ok-soft: #1c3324; --code-bg: #222c36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141a21; --sheet: #1b232c; --ink: #e3e9ef; --muted: #9aa8b6; --line: #2e3a46;
  --accent: #8db6dc; --accent-soft: #233447; --check: #f0a46a; --check-soft: #3a2717;
  --capture: #e3cf7a; --capture-soft: #332c12; --ok: #8fd0a0; --ok-soft: #1c3324; --code-bg: #222c36;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
.rail { border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
.brand small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.steps { display: flex; flex-direction: column; gap: 4px; }
.step-btn { display: flex; gap: 10px; align-items: baseline; text-align: left; border: 0; background: none; color: var(--muted); font: inherit; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; }
.step-btn .num { font-family: var(--font-mono); font-size: 12px; }
.step-btn[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.step-btn:disabled { cursor: default; opacity: 0.55; }
.step-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mode { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.mode .label { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: var(--sheet); color: var(--muted); font: inherit; padding: 6px 4px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--sheet); font-weight: 600; }
.mode p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
main { padding: 28px clamp(16px, 4vw, 48px) 64px; min-width: 0; }
.page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 17px; margin: 0 0 10px; }
h3 { font-size: 15px; margin: 0 0 8px; }
.badge { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--capture-soft); color: var(--capture); font-weight: 600; }
.badge.ai { background: var(--ok-soft); color: var(--ok); }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); }
input[type=text], textarea, select { font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; width: 100%; }
textarea { resize: vertical; min-height: 120px; }
.choice { display: flex; flex-wrap: wrap; gap: 8px; }
.choice label { display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 12px; cursor: pointer; background: var(--sheet); }
.choice label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice label:has(input:disabled) { opacity: 0.5; cursor: default; }
button.btn { font: inherit; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); border-radius: var(--radius); padding: 8px 14px; cursor: pointer; }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); font-weight: 600; }
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
button.btn.small { padding: 4px 10px; font-size: 13px; }
.drop { border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.files { display: flex; flex-direction: column; gap: 6px; }
.file-row { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.file-row .kind { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.file-row .name { overflow-wrap: anywhere; min-width: 0; }
.img-card { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 14px; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.img-card img { width: 100%; border: 1px solid var(--line); border-radius: 4px; }
.problems { margin: 0; padding-left: 18px; color: var(--check); font-size: 13px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tpl-preview { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tpl-preview span { background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.tpl-preview span.sub { background: transparent; border: 1px dashed var(--line); }
.tpl-edit { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-top: 10px; display: grid; gap: 8px; }
.tpl-edit.suggested { border-color: var(--accent); background: var(--accent-soft); }
.suggest-row { margin-top: 8px; align-items: center; }
.quality { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; background: var(--sheet); }
.quality summary { cursor: pointer; font-weight: 600; }
.quality ul { margin: 8px 0 0; padding-left: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; }
.quality li.warn { color: var(--check); }
.q-kind { display: inline-block; min-width: 44px; font-size: 11px; padding: 1px 6px; margin-right: 6px; border-radius: 999px; background: var(--code-bg); color: var(--muted); text-align: center; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; }
.gap-list { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
.gap-list .btn { padding: 0 6px; }
.metric { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
.metric b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.metric span { font-size: 12px; color: var(--muted); }
.metric.warn b { color: var(--check); }
.compare { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
.section { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.section-head { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.section-head h3 { margin: 0; }
.section.sub { margin-left: 14px; }
.fb-state { font-size: 11px; padding: 1px 8px; border-radius: 999px; }
.fb-state.done { background: var(--ok-soft); color: var(--ok); }
.fb-state.todo { background: var(--check-soft); color: var(--check); }
.md { min-width: 0; overflow-wrap: anywhere; }
.md p { margin: 0 0 6px; }
.md ul { margin: 0 0 6px; padding-left: 20px; }
.md .table-wrap { overflow-x: auto; margin: 4px 0 8px; }
.md table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--accent-soft); }
.md pre { background: var(--code-bg); border-radius: 4px; padding: 10px; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; margin: 4px 0 8px; }
.tag { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.check { color: var(--check); font-weight: 700; background: var(--check-soft); padding: 0 4px; border-radius: 3px; }
figure { margin: 6px 0 10px; }
figure img { width: 100%; max-width: 520px; border: 1px solid var(--line); border-radius: 4px; }
figcaption { font-size: 12px; color: var(--muted); }
.capture { background: var(--capture-soft); color: var(--capture); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; margin: 4px 0 8px; }
.capture label.btn { font-weight: 500; font-size: 13px; padding: 4px 10px; border: 1px solid currentColor; border-radius: var(--radius); cursor: pointer; }
.capture input { position: absolute; width: 1px; height: 1px; opacity: 0; }
details.fb { border-top: 1px solid var(--line); padding-top: 8px; }
details.fb summary { cursor: pointer; font-size: 13px; color: var(--accent); }
details.fb .stack { gap: 10px; margin-top: 10px; }
.notice { border-radius: var(--radius); padding: 10px 14px; font-size: 13px; }
.notice.warn { background: var(--check-soft); color: var(--check); }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice.info { background: var(--accent-soft); color: var(--ink); }
.asis-text { white-space: pre-wrap; font-size: 13px; background: var(--code-bg); border-radius: 4px; padding: 10px; max-height: 320px; overflow: auto; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.thumbs img { width: 100%; border: 1px solid var(--line); border-radius: 4px; }
.stream { white-space: pre-wrap; font-family: var(--font-mono); font-size: 12px; background: var(--code-bg); border-radius: 4px; padding: 10px; max-height: 260px; overflow: auto; }
.empty { color: var(--muted); }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; gap: 12px; }
  .steps { flex-direction: row; flex-wrap: wrap; }
  .compare, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .img-card { grid-template-columns: minmax(0, 1fr); }
  .section.sub { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

.toc { margin: 6px 0; padding-left: 20px; display: flex; flex-direction: column; gap: 2px; }
.evidence { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
details.panel > summary { cursor: pointer; font-weight: 600; }
.notice ul { margin: 6px 0 0; padding-left: 18px; }
code { font-family: var(--font-mono); font-size: 12px; }
.chg { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; vertical-align: middle; }
.chg.add { background: var(--ok-soft); color: var(--ok); }
.chg.mod { background: var(--check-soft); color: var(--check); }
.chg.del { background: var(--capture-soft); color: var(--capture); }
details.diff summary { cursor: pointer; font-size: 13px; color: var(--accent); }
details.diff pre { background: var(--code-bg); border-radius: 4px; padding: 10px; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; margin: 6px 0 0; }
details.diff .plus { color: var(--ok); }
details.diff .minus { color: var(--check); }
.guide { max-width: 1680px; }
.guide h2 { font-size: 18px; margin: 0; }
.guide .lead { margin: 0; color: var(--muted); }
.guide ol, .guide ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.guide .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.guide .eg { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; min-width: 0; }
.guide .eg b { display: block; margin-bottom: 4px; }
.guide .eg.good b { color: var(--ok); }
.guide .eg.bad b { color: var(--check); }
.guide .eg pre { margin: 0; white-space: pre-wrap; font-family: var(--font-body); font-size: 13px; background: none; padding: 0; }
.guide .toc-links { display: flex; flex-wrap: wrap; gap: 6px; }
.guide .toc-links a { font-size: 13px; color: var(--accent); }
.folder-row { padding: 6px 8px; border-radius: var(--radius); }
.folder-row .name { flex: 1; }
.folder-row.on { background: var(--accent-soft); }
table.versions { min-width: 760px; }
table.versions th { white-space: nowrap; }
table.versions td { vertical-align: middle; }
.field > p.hint { margin: 0; }
table.versions .acts { white-space: nowrap; }
/* 작성 가이드: 잘한 예 / 아쉬운 예 */
.g-flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.g-flow > div { flex: 1 1 160px; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; font-weight: 600; }
.g-flow > div b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--sheet); font-size: 12px; margin-right: 6px; }
.g-flow > div span { font-weight: 400; font-size: 12px; color: var(--muted); }
.g-flow > i { align-self: center; font-style: normal; color: var(--muted); }
.g-rule { background: var(--accent-soft); border-radius: var(--radius); padding: 10px 14px; font-size: 14px; }
.g-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.g-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.g-icon { font-size: 20px; }
.g-capcard img { width: 100%; height: 110px; object-fit: cover; object-position: top; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 4px; }
.g-sechead h2 { margin: 0; }
.g-sec-title { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.g-sec-title h3 { margin: 0; font-size: 17px; }
.g-no { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; background: var(--accent); color: var(--sheet); font-weight: 700; font-family: var(--font-mono); }
.g-tip { font-size: 13px; color: var(--muted); }
.g-compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.g-side { border: 2px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.g-side.good { border-color: var(--ok); }
.g-side.bad { border-color: var(--check); }
.g-badge { font-weight: 700; font-size: 13px; }
.g-side.good .g-badge { color: var(--ok); }
.g-side.bad .g-badge { color: var(--check); }
.g-in { display: flex; flex-direction: column; gap: 4px; }
.g-label { font-size: 11px; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
.g-quote { background: var(--code-bg); border-radius: 4px; padding: 8px 10px; font-size: 13px; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.g-chipcol { flex-direction: column; align-items: stretch; }
.g-chip, .g-imgchip { display: inline-flex; gap: 6px; align-items: center; background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 4px; font-size: 12px; min-width: 0; }
.g-chip { padding-left: 10px; }
.g-imgchip img { width: 34px; height: 24px; object-fit: cover; object-position: top; border-radius: 3px; border: 0; }
.g-arrow { font-size: 12px; color: var(--muted); font-weight: 600; }
.paper { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); font-size: 13px; min-width: 0; }
.paper-h { font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.paper figure img { max-width: 100%; }
.g-note { margin: 0; font-size: 12px; color: var(--muted); }
.g-outline { display: flex; flex-direction: column; gap: 6px; }
.g-orow { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; background: var(--sheet); }
.g-osec { font-size: 12px; font-weight: 600; min-width: 96px; }
.g-othumbs { display: flex; flex-wrap: wrap; gap: 4px; }
.g-othumbs img { width: 56px; height: 38px; object-fit: cover; object-position: top; border: 1px solid var(--line); border-radius: 3px; }
.g-tips { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.g-tips > div { background: var(--code-bg); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.g-tips span { color: var(--muted); font-size: 12px; }
.g-checklist { list-style: none; padding-left: 0 !important; }
.g-checklist li::before { content: "☐ "; color: var(--accent); }
@media (max-width: 860px) { .g-compare { grid-template-columns: minmax(0, 1fr); } }
.guide pre.ex-text { white-space: pre-wrap; font-family: var(--font-body); font-size: 13px; max-height: 320px; overflow: auto; }
.import-box { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); }
.nav-group { font-size: 11px; letter-spacing: 0.06em; color: var(--muted); margin: 10px 10px 2px; }
.nav-group:first-child { margin-top: 0; }
.ff-form { border: 1px dashed var(--accent); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); }
.chat { gap: 10px; }
.chat-thread { display: flex; flex-direction: column; gap: 12px; max-height: 60vh; min-height: 220px; overflow-y: auto; padding: 4px 2px; }
.bubble { max-width: min(680px, 88%); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; overflow-wrap: anywhere; }
.bubble.user { align-self: flex-end; background: var(--accent); color: var(--sheet); border-bottom-right-radius: 4px; }
.bubble.bot { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.b-who { font-size: 11px; color: var(--muted); font-weight: 600; }
.b-warn { color: var(--check); font-weight: 600; }
.b-extra { margin: 0; font-size: 13px; }
.chat-ev summary { cursor: pointer; font-size: 12px; color: var(--accent); }
.chat-ev .evidence { font-size: 12px; margin-top: 6px; }
.chat-suggest { margin-top: 4px; }
.chat-input { display: flex; gap: 8px; flex-wrap: wrap; }
.chat-input input { flex: 1 1 240px; }
@media (max-width: 860px) { .nav-group { flex-basis: 100%; margin: 4px 0 0; } }
.ex-step h2 { font-size: 18px; }
.ex-meta { margin: 0; font-size: 13px; }
.ex-secs { display: flex; flex-direction: column; gap: 8px; }
.ex-sub { margin-left: 16px; }
.ex-src { margin: 4px 0 0; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ex-row-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 15px; }
.ex-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ex-file summary { cursor: pointer; list-style: none; display: flex; gap: 6px; align-items: center; }
.ex-file pre { margin-top: 6px; }
@media (max-width: 860px) { .ex-sub { margin-left: 0; } }
.save-box { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--paper); }
